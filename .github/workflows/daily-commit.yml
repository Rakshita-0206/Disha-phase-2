name: Automated Daily Commits & Documentation Sync

on:
  schedule:
    # 5 runs every day, spaced realistically across Indian Standard Time (IST = UTC + 5:30):
    # 04:15 UTC = 09:45 AM IST (Morning start)
    # 07:15 UTC = 12:45 PM IST (Midday progress)
    # 10:15 UTC = 03:45 PM IST (Afternoon update)
    # 13:15 UTC = 06:45 PM IST (Evening review)
    # 16:15 UTC = 09:45 PM IST (Night wrap-up)
    - cron: '15 4 * * *'
    - cron: '15 7 * * *'
    - cron: '15 10 * * *'
    - cron: '15 13 * * *'
    - cron: '15 16 * * *'

  workflow_dispatch:
    inputs:
      num_commits:
        description: 'Number of commits to create right now (1 to 5)'
        required: false
        default: '4'

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git identity
        run: |
          git config --global user.name "Rakshita-0206"
          git config --global user.email "2613rakshitakb@gmail.com"

      - name: Generate commit(s)
        run: |
          COUNT="${{ github.event.inputs.num_commits || '1' }}"
          echo "Generating $COUNT commit(s)..."
          python scripts/run_daily_commits.py --count "$COUNT" --no-push

      - name: Push to GitHub
        run: |
          git pull --rebase origin main
          git push origin main
